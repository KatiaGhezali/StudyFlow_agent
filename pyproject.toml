[project]
name = "studyflow-agent"
version = "0.1.0"
description = "AI-powered study planning assistant built with LangChain, LangGraph, and Google Gemini"
readme = "README.md"
authors = [
    { name = "Katia Ghezali" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "tavily-python>=0.8.4",
]

[project.scripts]
studyflow-agent = "studyflow_agent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
